name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Conformance loads every built integration package.
      - run: npm run build
      - run: npm run check:markers

  gaffer:
    name: Gaffer host and panel consent (1.7.6.0, private profile)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the portable Gaffer and verify its digest
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gaffer.zip'
          Invoke-WebRequest 'https://github.com/GafferHQ/gaffer/releases/download/1.7.6.0/gaffer-1.7.6.0-windows.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '1B6C03F768E6FDFDE686A2AF256E59A313E1BFC64643371FA587DAC24AC69FC0') { throw 'Gaffer checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
      - name: Exercise the real graph, authenticated listener and offscreen panel
        shell: pwsh
        run: |
          $env:GAFFER_TEST_BIN = Join-Path $env:RUNNER_TEMP 'gaffer-1.7.6.0-windows/bin/gaffer.cmd'
          node --test integrations/gaffer/test/real-host.test.ts

  blender-native:
    name: Blender binding contract (OpenCode 2.2.5, private service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @neuralnomads/opencode-blender
      - name: Install the pinned native CLI outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/opencode-native" --no-save --package-lock=false @opencode/cli@2.2.5
      - name: Exercise native sessions with an authenticated fake host
        run: |
          export OPENCODE_TEST_BIN="$(node -e 'const p = require("node:path"); const root = p.join(process.env.RUNNER_TEMP, "opencode-native/node_modules/@opencode/cli"); console.log(p.resolve(root, require(p.join(root, "package.json")).bin.opencode))')"
          "$OPENCODE_TEST_BIN" --version
          node --test integrations/blender/test/native-session-bindings.test.ts

  blender:
    name: Blender host tests (Blender ${{ matrix.blender }}, background)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - blender: 5.2.3
            sha256: 78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache the pinned Blender
        id: blender-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender-${{ matrix.blender }}
          key: blender-${{ matrix.blender }}-${{ matrix.sha256 }}
      - name: Download Blender ${{ matrix.blender }} and check its sha256
        if: steps.blender-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ matrix.blender }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          archive="blender-${VERSION}-linux-x64.tar.xz"
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/$archive" "https://download.blender.org/release/Blender${VERSION%.*}/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$HOME/blender-${VERSION}"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$HOME/blender-${VERSION}" --strip-components=1
      - name: Libraries for background Blender
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - run: npm ci
      - name: Host tests and conformance against the add-on in Blender
        run: |
          export BLENDER_TEST_BIN="$HOME/blender-${{ matrix.blender }}/blender"
          "$BLENDER_TEST_BIN" --version
          node --test integrations/blender/test/blender.test.ts integrations/blender/test/conformance.test.ts

  trace-scan:
    name: Trace scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fork pull requests get no secrets: their scan is partial (every pattern but the Entra GUIDs).
      - name: Scan tree, archives, npm pack tarballs and history
        env:
          TRACE_SCAN_FINGERPRINTS: ${{ secrets.TRACE_SCAN_FINGERPRINTS }}
        run: |
          if [ -z "$TRACE_SCAN_FINGERPRINTS" ]; then
            echo "::warning title=Partial trace scan::TRACE_SCAN_FINGERPRINTS is not available; known Entra GUIDs were not checked."
          fi
          node scripts/trace-scan.ts --tree --packs --history
