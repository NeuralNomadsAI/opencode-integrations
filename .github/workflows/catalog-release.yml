name: Release the catalog

# Started by hand only. The release job waits for the protected
# `catalog-release` environment. Catalog releases are tagged `catalog-v<n>`,
# distinct from integration releases (`<app>-v<semver>`), and never marked
# latest: CodeNomad reads the newest `catalog-*` release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the catalog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:markers
      - name: Full trace scan
        env:
          TRACE_SCAN_FINGERPRINTS: ${{ secrets.TRACE_SCAN_FINGERPRINTS }}
        run: node scripts/trace-scan.ts --tree --history --require-fingerprints
      - id: tag
        name: Next catalog tag
        run: |
          last=$(git tag --list 'catalog-v*' | sed 's/^catalog-v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "tag=catalog-v$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ needs.verify.outputs.tag }}
    needs: verify
    runs-on: ubuntu-latest
    environment: catalog-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the catalog release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" catalog.json --target "$GITHUB_SHA" --title "Catalog ${TAG#catalog-v}" \
            --notes "Reviewed catalog of OpenCode integrations." --latest=false
